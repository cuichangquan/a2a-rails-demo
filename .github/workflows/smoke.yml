name: Rails A2A published Echo and candidate report smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: published
            gemfile: Gemfile
            smoke_args: ''
          - source: candidate
            gemfile: Gemfile.candidate
            smoke_args: --report
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
      A2A_GEM_SOURCE: ${{ matrix.source }}
      A2A_CANDIDATE_SHA: e13b3ef06698990c6a7b9e1522bf09f7c38e31c5
      RAILS_ENV: test
      RACK_ENV: test
      RAILS_MAX_THREADS: 1
      WEB_CONCURRENCY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.10'
          bundler-cache: true

      - name: Verify published or exact candidate source
        run: |
          bundle exec ruby -e '
            require "bundler"
            require "a2a-rails"
            spec = Gem.loaded_specs.fetch("a2a-rails")
            resolved = Bundler.load.specs.find { |candidate| candidate.name == "a2a-rails" }
            abort "Wrong A2A::Rails::VERSION" unless A2A::Rails::VERSION == spec.version.to_s
            source = resolved&.source
            if ENV.fetch("A2A_GEM_SOURCE") == "published"
              abort "Wrong published source" unless spec.version.to_s == "0.3.0" && source.is_a?(Bundler::Source::Rubygems)
              puts "PASS: published RubyGems 0.3.0"
            else
              abort "Wrong candidate source" unless source.is_a?(Bundler::Source::Git) && source.revision == ENV.fetch("A2A_CANDIDATE_SHA")
              puts "PASS: unpublished candidate #{source.revision} (Gem version #{spec.version})"
            end
            json_spec = Bundler.load.specs.find { |candidate| candidate.name == "json" }
            imap_spec = Bundler.load.specs.find { |candidate| candidate.name == "net-imap" }
            abort "Unpatched json" unless json_spec && Gem::Requirement.new(">= 2.19.9", "< 3").satisfied_by?(json_spec.version)
            abort "Unpatched net-imap" unless imap_spec && Gem::Requirement.new("~> 0.5.15").satisfied_by?(imap_spec.version)
            puts "PASS: json #{json_spec.version}, net-imap #{imap_spec.version}"
            puts "Path: #{spec.full_gem_path}"
          '

      - name: Verify synthetic report business Service
        run: bundle exec ruby test/sales_summary_test.rb

      - name: Start Rails on localhost only
        shell: bash
        run: |
          set -euo pipefail
          bundle exec rails server -b 127.0.0.1 -p 3000 > "$RUNNER_TEMP/demo-rails.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/demo-rails.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/.well-known/agent-card.json > /dev/null 2>&1; then
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/demo-rails.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/demo-rails.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/demo-rails.log"
          exit 1

      - name: Verify actual HTTP Echo, report, Task and Message flows
        run: bundle exec ruby bin/smoke ${{ matrix.smoke_args }}

      - name: Refuse production execution
        shell: bash
        run: |
          set -euo pipefail
          if RAILS_ENV=production bundle exec rails runner 'puts :unexpectedly_started' > "$RUNNER_TEMP/production-guard.log" 2>&1; then
            cat "$RUNNER_TEMP/production-guard.log"
            echo "Demo must refuse production mode" >&2
            exit 1
          fi
          grep -q "Demo is local-only" "$RUNNER_TEMP/production-guard.log"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-smoke-logs-${{ matrix.source }}
          path: |
            ${{ runner.temp }}/demo-rails.log
            ${{ runner.temp }}/production-guard.log
          retention-days: 7

      - name: Stop local Rails server
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/demo-rails.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/demo-rails.pid")" 2>/dev/null || true
          fi
